name: BuildOnly

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj
            **/global.json
            **/nuget.config

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-prerelease: true

      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Run: Compile'
        run: ./build.cmd Compile --configuration Release
        env:
          NUKE_TELEMETRY_OPTOUT: 'true'

      - name: Tests + Coverage (MTP)
        shell: bash
        working-directory: 'src'
        run: |
          dotnet test --solution ReactiveUI.AspNetCore.SignalR.Client.Rx.slnx \
            --configuration Release \
            --no-build \
            --max-parallel-test-modules 1 \
            --coverage \
            --coverage-output-format cobertura \
            --results-directory ./TestResults

      - name: Verify 100% production coverage
        shell: pwsh
        working-directory: 'src'
        run: ./eng/verify-coverage.ps1 -ResultsDirectory ./TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-coverage
          path: |
            ./**/TestResults/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 3
